[package]
name        = "nvfs-core"
version     = "0.1.0"
description = "A littlefs-class filesystem with no device attached: the superblock, the metadata pairs and their commit-and-seal cycle, the CTZ skip-list, the directory entries, and every operation from mount to fsck as a state machine that ANSWERS the block reads and writes a host must perform.  littlefs's four lfs_config callbacks turned into a value, so the format is exercised against a byte array and a power cut is a test that stops feeding answers."
license     = "Apache-2.0"

stability   = "experimental"

# `core`: arithmetic over block numbers, offsets and bytes the caller
# already holds.  Nothing here reads or programs a page — the machine
# returns the action and the host performs it — so no function declares
# an effect, and the whole package builds for a Cortex-M: three modules
# by allocating nothing, and the other three by saying `@tier(app)` on
# every function, which is what a device build needs to be told.
layer       = "core"

category    = "embedded"

tags        = ["littlefs", "filesystem", "flash", "nor", "wear-levelling", "power-loss", "embedded", "sans-io", "dogfood"]
repository  = "https://github.com/novolang/nvfs-core"
maintainers = ["novo-lang"]
novo        = ">= 0.23.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "A power-loss-resilient filesystem with the device left out"

[dependencies]
# crc-nv, and nothing else.
#
# EVERY COMMIT RECORD CARRIES A CRC-32C and a mismatch is what ends a
# block's valid log, so the checksum is not an accessory here — it is
# the whole crash-consistency story.  `orbit/novofs` carries its own
# forty-line bitwise CRC-32C; crc-nv publishes exactly that algorithm,
# table driven, asserted against the published check value 0xe3069283,
# with a streaming `update` that takes and returns an `Int` so a record
# can be summed as it is built.  Two implementations of one polynomial
# in one registry is the thing worth avoiding.
#
# It is named only by `nvfsmeta`, which is not what the device probe
# calls: `nvfsmeta` allocates by construction, so every function of it
# carries `@tier(app)` and a device build checks it at that tier.  The
# three modules the probe does call — `nvfsgeo`, `nvfsctz`, `nvfswear`
# — name nothing outside the language.
#
# No collection package.  The device half of this package is integers
# in the caller's own stack frame.  The buffers a firmware needs, the
# block image it reads into and the record it builds, are the caller's,
# and on a device they are the language's fixed-capacity collections
# (SPEC section 14.8).
crc-nv = "^0.1.4"
